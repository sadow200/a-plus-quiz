<script>
const DATA = [{"a": "AAA", "n": "Authentication, Authorization, and Accounting", "f": "Controls access in 3 steps: verify user, grant permissions, log activity. Used by RADIUS for Wi-Fi/VPN and TACACS+ for Cisco admin. Ports 1812/1813 RADIUS, 49 TACACS+.", "c": "Network"}, {"a": "ACL", "n": "Access Control List", "f": "Ordered allow/deny rules on routers, firewalls, files. Evaluated top-down with implicit deny at end. Used for packet filtering and NTFS permissions.", "c": "Network"}, {"a": "ADF", "n": "Automatic Document Feeder", "f": "Feeder on printers/scanners pulling 35-100 page stacks for scan/copy/fax. Clean rollers to avoid multi-feeds and jams.", "c": "Hardware"}, {"a": "AES", "n": "Advanced Encryption Standard", "f": "Symmetric encryption with 128/192/256-bit keys. Used in WPA2/WPA3, BitLocker, EFS, VPNs. Replaces DES; fast and secure.", "c": "Security"}, {"a": "AMD", "n": "Advanced Micro Devices, Inc.", "f": "Chip maker: Ryzen CPUs, EPYC servers, Radeon GPUs. Alternative to Intel/NVIDIA. Sockets AM4/AM5, PCIe 4.0/5.0.", "c": "Core"}, {"a": "AP", "n": "Access Point", "f": "Broadcasts Wi-Fi, bridging wireless clients to a wired LAN. Needs SSID, channel, WPA3 security, and PoE power. Managed or autonomous. Same role as WAP.", "c": "Network"}, {"a": "APFS", "n": "Apple File System", "f": "Apple file system for macOS/iOS with snapshots, encryption, space sharing, copy-on-write. Optimized for SSDs, replaces HFS+.", "c": "Core"}, {"a": "APIPA", "n": "Automatic Private Internet Protocol Addressing", "f": "Self-assigns 169.254.x.x/16 when DHCP fails. Sign of no DHCP server. Check cable, DHCP service, switch port.", "c": "Network"}, {"a": "ARM", "n": "Advanced RISC [Reduced Instruction Set Computer] Machine", "f": "Low-power RISC CPU for phones, tablets, Apple M-series. SoC design, efficient. May need x86 emulation for old apps.", "c": "Core"}, {"a": "ATX", "n": "Advanced Technology Extended", "f": "Standard board/PSU size 12x9.6in, 24-pin power. Variants Micro-ATX, Mini-ITX. Defines slots, mounting, connectors.", "c": "Hardware"}, {"a": "AUP", "n": "Acceptable Use Policy", "f": "Policy for proper use of computers, internet, data. Users sign it. Covers web, email, BYOD. Violations = warning/termination.", "c": "Core"}, {"a": "BEC", "n": "Business Email Compromise", "f": "Phishing impersonating execs/vendors for wire fraud. Verify callbacks, MFA, filter with SPF, DKIM, DMARC.", "c": "Network"}, {"a": "BIOS", "n": "Basic Input/Output System", "f": "Legacy firmware POSTing hardware, booting MBR disks. 2TB limit, text setup, no Secure Boot. Replaced by UEFI.", "c": "Hardware"}, {"a": "BNC", "n": "Bayonet Neill-Concelman", "f": "Twist-lock coax connector for old 10Base2 and CCTV. Round with lugs. Uses RG-59/RG-6.", "c": "Hardware"}, {"a": "BSOD", "n": "Blue Screen of Death", "f": "Windows stop error from driver, RAM, disk, overheat. Note code, check Event Viewer, test memory/disk, update drivers.", "c": "Core"}, {"a": "BYOD", "n": "Bring Your Own Device", "f": "Personal devices at work. Requires MDM, containerization, remote wipe, encryption to protect company data.", "c": "Core"}, {"a": "CAC", "n": "Calling-card Authorization Computer", "f": "CompTIA term Calling-card Authorization Computer for access auth. Know smart-card MFA like PIV cards for gov logins.", "c": "Security"}, {"a": "CAS", "n": "Column Address Strobe", "f": "RAM latency CL: delay before data. Lower CL is faster at same MHz, e.g. CL16 beats CL18. Check DDR timing.", "c": "Core"}, {"a": "CIFS", "n": "Common Internet File System", "f": "Legacy Microsoft file sharing, dialect of SMB. Chatty, insecure. Replaced by SMB2/3 on port 445.", "c": "Core"}, {"a": "CMDB", "n": "Configuration Management Database", "f": "ITIL database of all hardware/software assets and relationships. Used for change management and impact analysis.", "c": "Core"}, {"a": "CMOS", "n": "Complementary Metal-Oxide Semiconductor", "f": "Battery memory CR2032 holding BIOS/UEFI settings, clock, boot order. Clear via jumper/battery to reset.", "c": "Hardware"}, {"a": "CNAME", "n": "Canonical Name", "f": "DNS alias pointing one hostname to another name, e.g. www to host. Points to name not IP. Used for CDNs.", "c": "Core"}, {"a": "CPU", "n": "Central Processing Unit", "f": "Main processor: cores/threads, GHz, cache, socket LGA/AM5. Needs cooler and paste. 32 vs 64-bit.", "c": "Hardware"}, {"a": "DB-9", "n": "Serial Communications D-Shell Connector, 9 pins", "f": "9-pin serial D-shell for RS-232 console/COM. Used for switch CLI, legacy mice. Smaller than VGA.", "c": "Hardware"}, {"a": "DDoS", "n": "Distributed Denial of Service", "f": "Botnet flood overwhelming bandwidth/service. Larger than DoS. Mitigate CDN scrubbing, rate limit, ISP blackhole.", "c": "Network"}, {"a": "DDR", "n": "Double Data Rate", "f": "Double Data Rate RAM, 2 transfers/clock. Generations DDR3/4/5 differ in notch/voltage. Use matched pairs dual-channel.", "c": "Hardware"}, {"a": "DHCP", "n": "Dynamic Host Configuration Protocol", "f": "Auto IP, mask, gateway, DNS via DORA. UDP 67/68. Rogue server gives wrong IPs; use snooping. Check ipconfig.", "c": "Network"}, {"a": "DIMM", "n": "Dual In-line Memory Module", "f": "Desktop RAM stick 288-pin DDR4/5. Matched pairs for dual-channel. Check ECC vs non-ECC, speed.", "c": "Hardware"}, {"a": "DKIM", "n": "DomainKeys Identified Mail", "f": "Email auth with crypto signature in header, verified via DNS TXT. Works with SPF, DMARC to block spoofing.", "c": "Network"}, {"a": "DLP", "n": "Data Loss Prevention", "f": "Blocks exfil of PII/PHI via USB, email, cloud. Uses content inspection, endpoint agents, policies.", "c": "Security"}, {"a": "DMARC", "n": "Domain-based Message Authentication, Reporting, and Conformance", "f": "DNS TXT policy using SPF+DKIM: none/quarantine/reject. Sends reports. Stops domain spoofing.", "c": "Network"}, {"a": "DNS", "n": "Domain Name System", "f": "Resolves names to IPs: A, AAAA, MX, CNAME, TXT. TCP/UDP 53. If IP works but name fails, check DNS, flush cache.", "c": "Network"}, {"a": "DoS", "n": "Denial of Service", "f": "Single-source flood/crash, e.g. SYN flood. Patch, firewall rate limits. Smaller than DDoS.", "c": "Network"}, {"a": "DRM", "n": "Digital Rights Management", "f": "Copy protection limiting media/software copying. Needs activation. Can block Linux playback.", "c": "Core"}, {"a": "DSL", "n": "Digital Subscriber Line", "f": "Internet over phone lines with filters/splitters. ADSL asymmetric, VDSL faster. RJ11, PPPoE, distance-sensitive.", "c": "Core"}, {"a": "DVI", "n": "Digital Visual Interface", "f": "Digital video white connector: DVI-D digital, DVI-I integrated, DVI-A analog. No audio. Replaced by HDMI/DP.", "c": "Hardware"}, {"a": "ECC", "n": "Error-correcting Code", "f": "Server RAM correcting single-bit errors. Prevents crashes/corruption. Needs board support. Slightly slower.", "c": "Core"}, {"a": "EDR", "n": "Endpoint Detection and Response", "f": "Advanced endpoint protection monitoring processes, isolating hosts, rolling back ransomware. Beyond signature AV.", "c": "Security"}, {"a": "EFS", "n": "Encrypting File System", "f": "Windows file encryption with user certs. Protects if drive stolen. Back up keys. File-level vs BitLocker full-disk.", "c": "Security"}, {"a": "EOL", "n": "End-of-life", "f": "End-of-life: no patches/support. Replace or isolate. Continued use is compliance/security risk.", "c": "Core"}, {"a": "eSATA", "n": "External Serial Advanced Technology Attachment", "f": "External SATA up to 6Gbps for external HDDs. Hot-swap, needs power. Faster than old USB 2.0.", "c": "Hardware"}, {"a": "ESD", "n": "Electrostatic Discharge", "f": "Static damaging chips. Use wrist strap, mat, ground, anti-static bags. Causes intermittent dead parts.", "c": "Hardware"}, {"a": "eSIM", "n": "Embedded SIM", "f": "Soldered programmable SIM. Activate by QR/carrier app. Dual-SIM capable. No physical swap.", "c": "Core"}, {"a": "EULA", "n": "End-user License Agreement", "f": "Software license terms: installs allowed, transfer, reverse-engineering. OEM tied to board, retail transferable.", "c": "Core"}, {"a": "exFAT", "n": "Extended File Allocation Table", "f": "Flash FS for SD/USB over 4GB, Win+Mac readable. No journaling/permissions like NTFS. Ideal removable media.", "c": "Core"}, {"a": "FaaS", "n": "Function As A Service", "f": "Serverless: deploy single functions triggered by events, e.g. AWS Lambda. No servers to manage, pay per run.", "c": "Core"}, {"a": "FAT32", "n": "32-bit File Allocation Table", "f": "Legacy FS 4GB max file, 2TB volume, no permissions. Compatible with almost all USB. For small flash drives.", "c": "Core"}, {"a": "FRT", "n": "Facial Recognition Technology", "f": "Biometric face geometry login. Fast but privacy/bias concerns. Needs IR/depth for liveness.", "c": "Security"}, {"a": "FTP", "n": "File Transfer Protocol", "f": "Unencrypted transfer, TCP 21 control 20 data. Clear credentials. Use SFTP port 22 or FTPS instead.", "c": "Network"}, {"a": "GFS", "n": "Grandfather-Father-Son", "f": "Backup rotation Grandfather monthly, Father weekly, Son daily. Long retention with minimal media.", "c": "Core"}, {"a": "GPS", "n": "Global Positioning System", "f": "Satellite positioning for location/time/tracking. Needs sky view. Used phones, fleet MDM.", "c": "Core"}, {"a": "GPT", "n": "GUID [Globally Unique Identifier] Partition Table", "f": "Modern disk: over 2TB, 128 partitions, UEFI Secure Boot. Replaces MBR. Required for Windows 11.", "c": "Core"}, {"a": "GPU", "n": "Graphics Processing Unit", "f": "Renders graphics/3D/AI. Discrete PCIe vs integrated. Check VRAM, power connectors, drivers.", "c": "Hardware"}, {"a": "GUI", "n": "Graphical User Interface", "f": "Visual windows/icons vs CLI text. Examples Explorer, Finder. Easier but heavier.", "c": "Core"}, {"a": "GUID", "n": "Globally Unique Identifier", "f": "128-bit unique ID for partitions, AD objects. Prevents collisions. Looks like {21EC2020...}.", "c": "Core"}, {"a": "HD", "n": "High Definition", "f": "High Definition 720p 1280x720 or 1080p. Vs 4K. Check cable/display support.", "c": "Core"}, {"a": "HDD", "n": "Hard Disk Drive", "f": "Spinning magnetic 5400/7200 RPM 2.5/3.5in. Slower than SSD, shock-sensitive. Clicking and SMART warnings mean replace.", "c": "Hardware"}, {"a": "HDMI", "n": "High-definition Media Interface", "f": "Digital audio+video Type A. Versions support 4K/8K, ARC. No locking. Replaces VGA/DVI.", "c": "Hardware"}, {"a": "HSM", "n": "Hardware Security Module", "f": "Appliance safeguarding private keys for PKI, signing. Tamper-resistant. Vs TPM single-PC chip.", "c": "Core"}, {"a": "HTTP", "n": "Hypertext Transfer Protocol", "f": "Unencrypted web TCP 80. Visible traffic. Only public info. Redirect to HTTPS.", "c": "Network"}, {"a": "HTTPS", "n": "Hypertext Transfer Protocol Secure", "f": "Web over TLS TCP 443. Padlock certs. Required logins/payments. Check expiry.", "c": "Network"}, {"a": "IaaS", "n": "Infrastructure as a Service", "f": "Cloud renting VMs, storage, nets e.g. EC2. You manage OS/apps, provider hardware.", "c": "Core"}, {"a": "IAM", "n": "Identity and Access Management", "f": "Manages cloud users, groups, roles, MFA, least-privilege. Audit logs. 1201 includes and.", "c": "Core"}, {"a": "IMAP", "n": "Internet Mail Access Protocol", "f": "Syncs mail keeping on server multi-device. TCP 143 STARTTLS, 993 SSL. Vs POP deletes.", "c": "Network"}, {"a": "IOPS", "n": "Input/Output Operations Per Second", "f": "Storage speed ops/sec. SSDs 10k-100k vs HDD ~100. Important DBs/VMs.", "c": "Core"}, {"a": "IoT", "n": "Internet of Things", "f": "Smart cameras, thermostats on net. Default passwords insecure. Isolate guest VLAN, patch.", "c": "Core"}, {"a": "IP", "n": "Internet Protocol", "f": "Addressing/routing IPv4 192.168.x.x with NAT vs IPv6. Needs mask, gateway, public vs private.", "c": "Network"}, {"a": "IPS", "n": "In-plane Switching", "f": "IPS LCD best color/angles, slower than TN. Ideal photo work. In security means Intrusion Prevention.", "c": "Hardware"}, {"a": "IR", "n": "Infrared", "f": "Infrared line-of-sight for remotes/sensors. Short range. Sunlight interferes.", "c": "Core"}, {"a": "ISO", "n": "International Organization for Standardization", "f": "Standards body ISO 27001. Also .iso disk image for OS installs. Mount or burn to USB.", "c": "Core"}, {"a": "ISP", "n": "Internet Service Provider", "f": "Provider of internet cable/fiber/DSL/WISP. Gives modem, public IP, DNS. Check SLA speeds.", "c": "Core"}, {"a": "ITX", "n": "Information Technology eXtended", "f": "Small boards Mini-ITX 6.7in for SFF/HTPC. Fewer slots. Needs SFX PSU, low-profile cooler.", "c": "Core"}, {"a": "KVM", "n": "Keyboard-Video-Mouse", "f": "Shares one keyboard/monitor/mouse among PCs via button. Also Kernel hypervisor.", "c": "Hardware"}, {"a": "LAN", "n": "Local Area Network", "f": "Local building/home net Ethernet 1Gbps, Wi-Fi. Private IPs, switch, DHCP. Low latency.", "c": "Core"}, {"a": "LC", "n": "Lucent Connector", "f": "Small fiber connector with latch, 1.25mm ferrule, duplex pair. Push-pull design, used with SFP transceivers for Gigabit and 10Gb links.", "c": "Hardware"}, {"a": "LCD", "n": "Liquid Crystal Display", "f": "Flat panel needing LED backlight. Types TN/VA/IPS. Check brightness, contrast, response.", "c": "Hardware"}, {"a": "LDAP", "n": "Lightweight Directory Access Protocol", "f": "Queries AD directories for logins. TCP 389, LDAPS 636 SSL. Used address books.", "c": "Network"}, {"a": "LED", "n": "Light-emitting Diode", "f": "Diodes for indicators/backlights. Low power. Colors show link/activity/fault.", "c": "Hardware"}, {"a": "LTE", "n": "Long-Term Evolution", "f": "4G cellular ~100Mbps. Uses SIM/eSIM. Fallback WWAN laptops. Check bands.", "c": "Network"}, {"a": "MAC", "n": "Media Access Control", "f": "48-bit NIC hardware AA:BB:CC. For filtering, DHCP reservation. First half OUI vendor.", "c": "Network"}, {"a": "MAN", "n": "Metropolitan Area Network", "f": "Metro city/campus net fiber/MPLS. Larger than LAN smaller than WAN.", "c": "Network"}, {"a": "MBR", "n": "Master Boot Record", "f": "Legacy boot 2TB limit 4 primaries. BIOS only. Replace GPT/UEFI.", "c": "Core"}, {"a": "MDM", "n": "Mobile Device Management", "f": "Manages phones: enroll, apps, PIN/encryption, wipe/lock. For BYOD.", "c": "Core"}, {"a": "MDR", "n": "Managed Detection and Response", "f": "Outsourced SOC 24/7 hunting/response beyond EDR. Includes intel, IR.", "c": "Security"}, {"a": "MFA", "n": "Multifactor Authentication", "f": "Needs 2+ factors know/have/are. Blocks 99% phishing. Authenticator, SMS, biometrics.", "c": "Security"}, {"a": "MFP", "n": "Multifunction Printer", "f": "All-in-one print/scan/copy/fax. Uses ADF, duplex, network share. Maintain toner/drums.", "c": "Hardware"}, {"a": "MMC", "n": "Microsoft Management Console", "f": "Windows mmc.exe hosting snap-ins Device Manager, Disk Management, Group Policy.", "c": "Core"}, {"a": "MNDA", "n": "Mutual Non-disclosure Agreement", "f": "Mutual NDA both sides protect secrets. Needed vendor partnerships.", "c": "Core"}, {"a": "mSATA", "n": "Mini-serial Advanced Technology Attachment", "f": "Mini SSD 51mm older ultrabooks. SATA speeds. Replaced M.2/NVMe.", "c": "Hardware"}, {"a": "MX", "n": "Mail Exchange", "f": "DNS Mail Exchange routing mail with priority 10,20. Wrong MX means no mail.", "c": "Core"}, {"a": "NAC", "n": "Network Access Control", "f": "Checks patch/AV health before LAN/Wi-Fi. Quarantines to guest VLAN if fail.", "c": "Network"}, {"a": "NAS", "n": "Network Attached Storage", "f": "File sharing over LAN SMB/NFS for backups/media. RAID. Vs SAN block, DAS direct.", "c": "Core"}, {"a": "NAT", "n": "Network Address Translation", "f": "Router translates private to one public IP PAT overload. Enables IPv4 sharing. Needs port forward.", "c": "Network"}, {"a": "NDA", "n": "Non-disclosure Agreement", "f": "Legal confidentiality one-way. Violation lawsuit. Vs mutual MNDA.", "c": "Core"}, {"a": "NetBI   }catch(e){ return text; }
}
let order=DATA.map((_,i)=>i), idx=0, flipped=false, known=new Set(), wrong=new Set(), mcAnswer=-1, thisDir='a2d', mcLocked=false, mcTimeout=null;
function clearPending(){ if(mcTimeout){ clearTimeout(mcTimeout); mcTimeout=null; } mcLocked=false; }
function fyShuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let prevCardId=null, prevModeVal='', prevDirVal='';
const card=document.getElementById('card'), bar=document.getElementById('bar'),
count=document.getElementById('count'), score=document.getElementById('score'),
mode=document.getElementById('mode'), dir=document.getElementById('dir');
function curDir(){let d=dir.value; if(d==='mix') return Math.random()<0.5?'a2d':'d2a'; return d;}
function render(){
  const cardId=order[idx];
  const d=DATA[cardId];
  if(cardId!==prevCardId || mode.value!==prevModeVal || dir.value!==prevDirVal){ if(mode.value==='flash' && !flipped && dir.value!=='mix') thisDir=dir.value; else if(mode.value==='mc') thisDir=curDir(); else if(dir.value!=='mix') thisDir=dir.value; else thisDir=curDir(); prevCardId=cardId; prevModeVal=mode.value; prevDirVal=dir.value; }
  const backFunc=expandAcros(d.f,d.a);
  if(mode.value==='flash'){
    document.getElementById('flashBtns').style.display='flex';
    document.getElementById('mcBtns').style.display='none';
    if(!flipped){
      if(thisDir==='a2d') card.innerHTML='<div class="acro">'+esc(d.a)+'</div><div class="cat">'+esc(d.c)+' • tap to flip</div>';
      else card.innerHTML='<div class="func">'+backFunc+'</div><div class="cat">'+esc(d.c)+' • guess acronym</div>';
    } else {
      card.innerHTML='<div class="acro">'+esc(d.a)+'</div><div class="name">'+esc(d.n)+'</div><div class="func">'+backFunc+'</div><div class="cat">'+esc(d.c)+'</div>';
    }
  } else {
    document.getElementById('flashBtns').style.display='none';
    const box=document.getElementById('mcBtns'); box.style.display='block';
    mcLocked=false;
    let opts=new Set([order[idx]]);
    while(opts.size<4) opts.add(Math.floor(Math.random()*DATA.length));
    opts=fyShuffle([...opts]);
    mcAnswer=opts.indexOf(order[idx]);
    if(thisDir==='a2d'){
      card.innerHTML='<div class="acro">'+esc(d.a)+'</div><div class="cat">Pick full name</div>';
      box.innerHTML=opts.map((oi,i)=>{const o=DATA[oi];return '<button data-i="'+i+'"><b>'+esc(o.n)+'</b><br><span style="color:#94a3b8">'+esc(expandAcros(o.f,o.a))+'</span></button>'}).join('');
    } else {
      card.innerHTML='<div class="func">'+backFunc+'</div><div class="cat">Pick acronym</div>';
      box.innerHTML=opts.map((oi,i)=>'<button data-i="'+i+'"><b>'+esc(DATA[oi].a)+'</b> — '+esc(DATA[oi].n)+'</button>').join('');
    }
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      if(mcLocked) return;
      mcLocked=true;
      box.querySelectorAll('button').forEach(x=>{x.disabled=true; x.style.opacity='0.9';});
      const pick=+b.dataset.i;
      if(pick===mcAnswer){b.style.background='#15803d';known.add(order[idx]);wrong.delete(order[idx]);} else {b.style.background='#b91c1c';wrong.add(order[idx]);known.delete(order[idx]);box.children[mcAnswer].style.background='#15803d';}
      update(); mcTimeout=setTimeout(()=>{mcTimeout=null; idx=(idx+1)%order.length;flipped=false;mcLocked=false;render();},700);
    });
  }
  update();
}
function update(){count.textContent='Card '+(idx+1)+'/'+order.length;score.textContent='Knew: '+known.size+' • Review: '+wrong.size;bar.style.width=((known.size+wrong.size)/order.length*100)+'%';}
document.getElementById('next').onclick=()=>{clearPending();idx=(idx+1)%order.length;flipped=false;render();};
document.getElementById('prev').onclick=()=>{clearPending();idx=(idx-1+order.length)%order.length;flipped=false;render();};
document.getElementById('flip').onclick=()=>{ if(mode.value==='mc' && mcLocked) return; flipped=!flipped;render(); };
card.onclick=()=>{if(mode.value==='flash'){flipped=!flipped;render();}};
document.getElementById('know').onclick=()=>{clearPending();known.add(order[idx]);wrong.delete(order[idx]);idx=(idx+1)%order.length;flipped=false;render();};
document.getElementById('dont').onclick=()=>{clearPending();wrong.add(order[idx]);known.delete(order[idx]);idx=(idx+1)%order.length;flipped=false;render();};
document.getElementById('shuffle').onclick=()=>{clearPending();order=fyShuffle([...order]);idx=0;flipped=false;render();};
mode.onchange=()=>{clearPending();flipped=false;render();}; dir.onchange=()=>{clearPending();render();};
const searchBox=document.getElementById('search');
searchBox.addEventListener('keydown',e=>{ if(e.key!=='Enter')return; const q=searchBox.value.trim().toLowerCase(); if(!q)return; const f=DATA.findIndex(d=>d.a.toLowerCase()===q||d.n.toLowerCase().includes(q)); if(f>=0){clearPending(); if(order.length!==DATA.length){order=DATA.map((_,i)=>i);} const oi=order.indexOf(f); idx=oi>=0?oi:0; flipped=true; render(); }});
order=fyShuffle([...order]); idx=0; flipped=false; render();
</script>
</body>
</html>
