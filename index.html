<style>

<body>
<header><h1>CompTIA A+ Quiz — 200 Terms <small>V15 1201/1202 • detailed</small></h1></header>
<div class="controls">
<select id="mode"><option value="flash">Flashcards</option><option value="mc">Multiple Choice</option></select>
<select id="dir"><option value="a2d">Acronym → Definition</option><option value="d2a">Definition → Acronym</option><option value="mix">Mixed</option></select>
<select id="exam"><option value="all">All Exams (200)</option><option value="1201">Core 1 – 1201 (138)</option><option value="1202">Core 2 – 1202 (81)</option></select>
<button id="shuffle" class="primary">Shuffle</button>
<button id="flip">Flip</button>
<button id="resetTop">Reset</button>
</div>
<div class="progress"><div id="bar"></div></div>
<div class="stats"><span id="count"></span><span id="score"></span></div>
<main>
<div class="card" id="card"></div>
<div class="row" id="flashBtns">
<button id="prev">◀ Prev</button>
<button id="know" class="good">Knew ✓</button>
<button id="dont" class="bad">Review ✗</button>
<button id="next">Next ▶</button>
</div>
<div id="mcBtns" style="display:none"></div>
<div id="review" style="display:none;background:#fff;color:#111827;border-radius:16px;padding:20px;margin-top:12px"></div>
<div class="row" id="searchRow"><input id="search" placeholder="Search e.g. DNS, RAID, USB… (Enter)" style="flex:1"></div>
<p class="hint" id="hint">Tap card to flip. Answers auto-expand acronyms in parentheses. Example: TCP becomes TCP (Transmission Control Protocol). Works offline on phone/desktop.</p>
</main>
<script>
const DATA = [{"a": "AAA", "n": "Authentication, Authorization, and Accounting", "f": "Controls access: verify user, grant permissions, log activity. RADIUS UDP 1812/1813 for Wi-Fi/VPN, TACACS+ TCP 49 for Cisco admin.", "c": "Network"}, {"a": "ACL", "n": "Access Control List", "f": "Ordered allow/deny rules on routers, firewalls, files. Evaluated top-down with implicit deny at end. Used for packet filtering and NTFS permissions.", "c": "Network"}, {"a": "ADF", "n": "Automatic Document Feeder", "f": "Feeder on printers/scanners pulling 35-100 page stacks for scan/copy/fax. Clean rollers to avoid multi-feeds and jams.", "c": "Hardware"}, {"a": "AES", "n": "Advanced Encryption Standard", "f": "Symmetric encryption with 128/192/256-bit keys. Used in WPA2/WPA3, BitLocker, EFS, VPNs. Replaces DES; fast and secure.", "c": "Security"}, {"a": "AMD", "n": "Advanced Micro Devices, Inc.", "f": "Chip maker: Ryzen CPUs, EPYC servers, Radeon GPUs. Alternative to Intel/NVIDIA. Sockets AM4/AM5, PCIe 4.0/5.0.", "c": "Core"}, {"a": "AP", "n": "Access Point", "f": "Broadcasts Wi-Fi, bridging wireless clients to a wired LAN. Often powered via PoE. Autonomous or controller-based lightweight/CAPWAP. Needs SSID, channel, WPA3.", "c": "Network"}, {"a": "APFS", "n": "Apple File System", "f": "Apple file system for macOS/iOS with snapshots, encryption, space sharing, copy-on-write. Optimized for SSDs, replaces HFS+.", "c": "Core"}, {"a": "APIPA", "n": "Automatic Private Internet Protocol Addressing", "f": "Self-assigns 169.254.0.0/16 link-local when DHCP fails, mask 255.255.0.0. Sign of no DHCP server. Check cable and service.", "c": "Network"}, {"a": "ARM", "n": "Advanced RISC [Reduced Instruction Set Computer] Machine", "f": "Low-power RISC CPU for phones, tablets, Apple M-series. SoC design, efficient. May need x86 emulation for old apps.", "c": "Core"}, {"a": "ATX", "n": "Advanced Technology Extended", "f": "Standard motherboard size 12x9.6in, 24-pin power. ATX power supplies follow a separate ATX PSU spec. Variants Micro-ATX, Mini-ITX. Defines slots and mounting.", "c": "Hardware"}, {"a": "AUP", "n": "Acceptable Use Policy", "f": "Policy for proper use of computers, internet, data. Users sign it. Covers web, email, BYOD. Violations = warning/termination.", "c": "Core"}, {"a": "BEC", "n": "Business Email Compromise", "f": "Phishing impersonating execs/vendors for wire fraud. Verify callbacks, MFA, filter with SPF, DKIM, DMARC.", "c": "Network"}, {"a": "BIOS", "n": "Basic Input/Output System", "f": "Legacy firmware POSTing hardware, booting MBR disks. 2TB limit, text setup, no Secure Boot. Replaced by UEFI.", "c": "Hardware"}, {"a": "BNC", "n": "Bayonet Neill-Concelman", "f": "Twist-lock coax: 10Base2 ThinNet uses RG-58 50-ohm, CCTV uses RG-59/RG-6 75-ohm. Bayonet lugs.", "c": "Hardware"}, {"a": "BSOD", "n": "Blue Screen of Death", "f": "Windows stop error from driver, RAM, disk, overheat. Note code, check Event Viewer, test memory/disk, update drivers.", "c": "Core"}, {"a": "BYOD", "n": "Bring Your Own Device", "f": "Personal devices at work. Requires MDM, containerization, remote wipe, encryption to protect company data.", "c": "Core"}, {"a": "CAC", "n": "Calling-card Authorization Computer", "f": "CompTIA list wording: Calling-card Authorization Computer for access auth. Real world: Common Access Card smart-card MFA and physical access. Know both; memorize CompTIA wording for exam.", "c": "Security"}, {"a": "CAS", "n": "Column Address Strobe", "f": "Supplemental term, not in official CompTIA acronym list. RAM latency CL: delay before data is ready. Lower is faster at same MHz, e.g. CL16 beats CL18.", "c": "Core"}, {"a": "CIFS", "n": "Common Internet File System", "f": "Legacy Microsoft file sharing, a dialect of SMB. Chatty and insecure. Replaced by SMB2/3. Legacy NetBIOS ports 137-139; direct SMB port 445.", "c": "Core"}, {"a": "CMDB", "n": "Configuration Management Database", "f": "ITIL database of all hardware/software assets and relationships. Used for change management and impact analysis.", "c": "Core"}, {"a": "CMOS", "n": "Complementary Metal-Oxide Semiconductor", "f": "Low-power NVRAM and real-time clock powered by a CR2032 cell, holding BIOS and UEFI settings, date, and boot order. Clear via jumper, button, or battery removal.", "c": "Hardware"}, {"a": "CNAME", "n": "Canonical Name", "f": "DNS alias pointing one hostname to another name, e.g. www to host. Points to name not IP. Used for CDNs.", "c": "Core"}, {"a": "CPU", "n": "Central Processing Unit", "f": "Main processor: cores, threads, clock speed, cache. Sockets LGA including Intel and AM5, PGA including AM4. Needs cooler and thermal paste.", "c": "Hardware"}, {"a": "DB-9", "n": "Serial Communications D-Shell Connector, 9 pins", "f": "9-pin serial D-shell for RS-232 console/COM. Used for switch CLI, legacy mice. Smaller than VGA.", "c": "Hardware"}, {"a": "DDoS", "n": "Distributed Denial of Service", "f": "Botnet flood overwhelming bandwidth/service. Larger than DoS. Mitigate CDN scrubbing, rate limit, ISP blackhole.", "c": "Network"}, {"a": "DDR", "n": "Double Data Rate", "f": "Double Data Rate RAM, 2 transfers/clock. Generations DDR3/4/5 differ in notch/voltage. Use matched pairs dual-channel.", "c": "Hardware"}, {"a": "DHCP", "n": "Dynamic Host Configuration Protocol", "f": "Auto IP, mask, gateway, DNS via DORA. UDP 67 server, 68 client. Rogue server gives wrong IPs; use DHCP snooping.", "c": "Network"}, {"a": "DIMM", "n": "Dual In-line Memory Module", "f": "Desktop RAM stick 288-pin DDR4/5. Matched pairs for dual-channel. Check ECC vs non-ECC, speed.", "c": "Hardware"}, {"a": "DKIM", "n": "DomainKeys Identified Mail", "f": "Email auth with crypto signature in header, verified via DNS TXT. Works with SPF, DMARC to block spoofing.", "c": "Network"}, {"a": "DLP", "n": "Data Loss Prevention", "f": "Blocks exfiltration of sensitive data like PII and PHI via USB, email, and cloud. Content inspection, endpoint agents, policies. Not to be confused with projector Digital Light Processing.", "c": "Security"}, {"a": "DMARC", "n": "Domain-based Message Authentication, Reporting, and Conformance", "f": "DNS TXT policy using SPF+DKIM: none/quarantine/reject. Sends reports. Stops domain spoofing.", "c": "Network"}, {"a": "DNS", "n": "Domain Name System", "f": "Resolves names to IPs: A, AAAA, MX, CNAME, TXT. TCP/UDP 53. If IP works but name fails, check DNS, flush cache.", "c": "Network"}, {"a": "DoS", "n": "Denial of Service", "f": "Single-source flood/crash, e.g. SYN flood. Patch, firewall rate limits. Smaller than DDoS.", "c": "Network"}, {"a": "DRM", "n": "Digital Rights Management", "f": "Copy protection limiting media/software copying. Needs activation. Can block Linux playback.", "c": "Core"}, {"a": "DSL", "n": "Digital Subscriber Line", "f": "Internet over phone lines with filters/splitters. ADSL asymmetric, VDSL faster. RJ11, PPPoE, distance-sensitive.", "c": "Core"}, {"a": "DVI", "n": "Digital Visual Interface", "f": "Digital video white connector: DVI-D digital, DVI-I integrated, DVI-A analog. No audio. Replaced by HDMI/DP.", "c": "Hardware"}, {"a": "ECC", "n": "Error-correcting Code", "f": "Server RAM detecting and correcting single-bit errors. Needs motherboard and CPU support. Slightly slower and costlier.", "c": "Core"}, {"a": "EDR", "n": "Endpoint Detection and Response", "f": "Advanced endpoint protection monitoring processes, isolating hosts, rolling back ransomware. Beyond signature AV.", "c": "Security"}, {"a": "EFS", "n": "Encrypting File System", "f": "Windows file encryption with user certs. Protects if drive stolen. Back up keys. File-level vs BitLocker full-disk.", "c": "Security"}, {"a": "EOL", "n": "End-of-life", "f": "End-of-life: no patches/support. Replace or isolate. Continued use is compliance/security risk.", "c": "Core"}, {"a": "eSATA", "n": "External Serial Advanced Technology Attachment", "f": "External SATA up to 6Gbps for external HDDs. Hot-swap, needs power. Faster than old USB 2.0.", "c": "Hardware"}, {"a": "ESD", "n": "Electrostatic Discharge", "f": "Static damaging chips. Use wrist strap, mat, ground, anti-static bags. Causes intermittent dead parts.", "c": "Hardware"}, {"a": "eSIM", "n": "Embedded SIM", "f": "Soldered programmable SIM. Activate by QR/carrier app. Dual-SIM capable. No physical swap.", "c": "Core"}, {"a": "EULA", "n": "End-user License Agreement", "f": "Software license terms: installs allowed, transfer, reverse-engineering. OEM tied to board, retail transferable.", "c": "Core"}, {"a": "exFAT", "n": "Extended File Allocation Table", "f": "Flash FS for SD/USB over 4GB, Win+Mac readable. No journaling/permissions like NTFS. Ideal removable media.", "c": "Core"}, {"a": "FaaS", "n": "Function as a Service", "f": "Serverless: deploy single functions triggered by events, e.g. AWS Lambda. No servers to manage, pay per run.", "c": "Core"}, {"a": "FAT32", "n": "32-bit File Allocation Table", "f": "Legacy FS 4GB max file, 2TB volume, no permissions. Compatible with almost all USB. For small flash drives.", "c": "Core"}, {"a": "FRT", "n": "Facial Recognition Technology", "f": "Biometric face geometry login. Fast but privacy/bias concerns. Needs IR/depth for liveness.", "c": "Security"}, {"a": "FTP", "n": "File Transfer Protocol", "f": "Unencrypted transfer, TCP 21 control 20 data. Clear credentials. Use SFTP port 22 or FTPS instead.", "c": "Network"}, {"a": "GFS", "n": "Grandfather-Father-Son", "f": "Backup rotation Grandfather monthly, Father weekly, Son daily. Long retention with minimal media.", "c": "Core"}, {"a": "GPS", "n": "Global Positioning System", "f": "Satellite positioning for location/time/tracking. Needs sky view. Used phones, fleet MDM.", "c": "Core"}, {"a": "GPT", "n": "GUID [Globally Unique Identifier] Partition Table", "f": "Modern disk: over 2TB, 128 partitions, UEFI Secure Boot. Replaces MBR. Required for Windows 11.", "c": "Core"}, {"a": "GPU", "n": "Graphics Processing Unit", "f": "Renders graphics/3D/AI. Discrete PCIe vs integrated. Check VRAM, power connectors, drivers.", "c": "Hardware"}, {"a": "GUI", "n": "Graphical User Interface", "f": "Visual windows/icons vs CLI text. Examples Explorer, Finder. Easier but heavier.", "c": "Core"}, {"a": "GUID", "n": "Globally Unique Identifier", "f": "128-bit unique ID for partitions, AD objects. Prevents collisions. Looks like {21EC2020...}.", "c": "Core"}, {"a": "HD", "n": "High Definition", "f": "High Definition 720p 1280x720 or 1080p. Vs 4K. Check cable/display support.", "c": "Core"}, {"a": "HDD", "n": "Hard Disk Drive", "f": "Spinning magnetic 5400/7200 RPM 2.5/3.5in. Slower than SSD, shock-sensitive. Clicking and SMART warnings mean replace.", "c": "Hardware"}, {"a": "HDMI", "n": "High-definition Media Interface", "f": "Digital audio+video in one cable, Type A standard. Versions support 4K/8K, ARC. Industry full name High-Definition Multimedia Interface; exam list shortens to Media Interface. Replaces VGA/DVI.", "c": "Hardware"}, {"a": "HSM", "n": "Hardware Security Module", "f": "Appliance safeguarding private keys for PKI, signing. Tamper-resistant. Vs TPM single-PC chip.", "c": "Core"}, {"a": "HTTP", "n": "Hypertext Transfer Protocol", "f": "Unencrypted web TCP 80. Visible traffic. Only public info. Redirect to HTTPS.", "c": "Network"}, {"a": "HTTPS", "n": "Hypertext Transfer Protocol Secure", "f": "Web over TLS TCP 443. Padlock certs. Required logins/payments. Check expiry.", "c": "Network"}, {"a": "IaaS", "n": "Infrastructure as a Service", "f": "Cloud renting VMs, storage, nets e.g. EC2. You manage OS/apps, provider hardware.", "c": "Core"}, {"a": "IAM", "n": "Identity and Access Management", "f": "Manages cloud users, groups, roles, MFA, least privilege. Audit logs. Note: 1201 list has and (Identity and Access Management); 1202 list drops it.", "c": "Core"}, {"a": "IMAP", "n": "Internet Mail Access Protocol", "f": "Syncs mail keeping on server multi-device. TCP 143 STARTTLS, 993 SSL. Vs POP deletes.", "c": "Network"}, {"a": "IOPS", "n": "Input/Output Operations Per Second", "f": "Storage speed ops/sec. SSDs 10k-100k vs HDD ~100. Important DBs/VMs.", "c": "Core"}, {"a": "IoT", "n": "Internet of Things", "f": "Smart cameras, thermostats on net. Default passwords insecure. Isolate guest VLAN, patch.", "c": "Core"}, {"a": "IP", "n": "Internet Protocol", "f": "Addressing/routing IPv4 192.168.x.x with NAT vs IPv6. Needs mask, gateway, public vs private.", "c": "Network"}, {"a": "IPS", "n": "In-plane Switching", "f": "In-plane Switching LCD panel: best color and viewing angles, slower response than TN. Ideal for photo work. Not to be confused with security Intrusion Prevention System.", "c": "Hardware"}, {"a": "IR", "n": "Infrared", "f": "Infrared line-of-sight for remotes/sensors. Short range. Sunlight interferes.", "c": "Core"}, {"a": "ISO", "n": "International Organization for Standardization", "f": "Standards body ISO 27001. Also .iso disk image for OS installs. Mount or burn to USB.", "c": "Core"}, {"a": "ISP", "n": "Internet Service Provider", "f": "Provider of internet cable/fiber/DSL/WISP. Gives modem, public IP, DNS. Check SLA speeds.", "c": "Core"}, {"a": "ITX", "n": "Information Technology eXtended", "f": "Small boards: Mini-ITX 6.7in, Nano-ITX for SFF/HTPC. Fewer slots. Typically paired with SFX PSU and low-profile cooler depending on case.", "c": "Core"}, {"a": "KVM", "n": "Keyboard-Video-Mouse", "f": "Shares one keyboard/monitor/mouse among PCs via button. Also Kernel hypervisor.", "c": "Hardware"}, {"a": "LAN", "n": "Local Area Network", "f": "Local building/home net Ethernet 1Gbps, Wi-Fi. Private IPs, switch, DHCP. Low latency.", "c": "Core"}, {"a": "LC", "n": "Lucent Connector", "f": "Small fiber connector with latch, 1.25mm ferrule, duplex pair. Push-pull design, used with SFP transceivers for Gigabit and 10Gb links.", "c": "Hardware"}, {"a": "LCD", "n": "Liquid Crystal Display", "f": "Flat panel needing LED backlight. Types TN/VA/IPS. Check brightness, contrast, response.", "c": "Hardware"}, {"a": "LDAP", "n": "Lightweight Directory Access Protocol", "f": "Queries AD directories for logins. TCP 389, LDAPS 636 SSL. Used address books.", "c": "Network"}, {"a": "LED", "n": "Light-emitting Diode", "f": "Diodes for indicators/backlights. Low power. Colors show link/activity/fault.", "c": "Hardware"}, {"a": "LTE", "n": "Long-Term Evolution", "f": "4G cellular, typically tens to around 100Mbps real-world. Uses SIM/eSIM. Fallback for WWAN laptops. Check bands.", "c": "Network"}, {"a": "MAC", "n": "Media Access Control", "f": "48-bit NIC hardware AA:BB:CC. For filtering, DHCP reservation. First half OUI vendor.", "c": "Network"}, {"a": "MAN", "n": "Metropolitan Area Network", "f": "Metro city/campus net fiber/MPLS. Larger than LAN smaller than WAN.", "c": "Network"}, {"a": "MBR", "n": "Master Boot Record", "f": "Legacy boot 2TB limit 4 primaries. BIOS only. Replace GPT/UEFI.", "c": "Core"}, {"a": "MDM", "n": "Mobile Device Management", "f": "Manages phones: enroll, apps, PIN/encryption, wipe/lock. For BYOD.", "c": "Core"}, {"a": "MDR", "n": "Managed Detection and Response", "f": "Outsourced SOC 24/7 hunting/response beyond EDR. Includes intel, IR.", "c": "Security"}, {"a": "MFA", "n": "Multifactor Authentication", "f": "Requires 2 or more factors: know, have, are. Blocks the vast majority of automated and phishing-driven logins (commonly cited around 99%). Authenticator, SMS, biometrics.", "c": "Security"}, {"a": "MFP", "n": "Multifunction Printer", "f": "All-in-one print/scan/copy/fax. Uses ADF, duplex, network share. Maintain toner/drums.", "c": "Hardware"}, {"a": "MMC", "n": "Microsoft Management Console", "f": "Windows mmc.exe hosting snap-ins Device Manager, Disk Management, Group Policy.", "c": "Core"}, {"a": "MNDA", "n": "Mutual Non-disclosure Agreement", "f": "Mutual agreement where both parties protect shared secrets. Needed before vendor partnerships.", "c": "Core"}, {"a": "mSATA", "n": "Mini-serial Advanced Technology Attachment", "f": "Mini SSD (full-size 51x30mm; half-size 26.8x30mm also exists) for older ultrabooks. SATA interface and speeds, not PCIe. Superseded BY M.2/NVMe.", "c": "Hardware"}, {"a": "MX", "n": "Mail Exchange", "f": "DNS Mail Exchange routing mail with priority 10,20. Wrong MX means no mail.", "c": "Core"}, {"a": "NAC", "n": "Network Access Control", "f": "Checks patch/AV health before LAN/Wi-Fi. Quarantines to guest VLAN if fail.", "c": "Network"}, {"a": "NAS", "n": "Network Attached Storage", "f": "File sharing over LAN SMB/NFS for backups/media. RAID. Vs SAN block, DAS direct.", "c": "Core"}, {"a": "NAT", "n": "Network Address Translation", "f": "Translates addresses: NAT 1:1, PAT/NAPT overload many private IPs to one public IP. Enables IPv4 sharing. Configure port forwarding.", "c": "Network"}, {"a": "NDA", "n": "Non-disclosure Agreement", "f": "Legal confidentiality one-way. Violation lawsuit. Vs mutual MNDA.", "c": "Core"}, {"a": "NetBIOS", "n": "Network Basic Input/Output System", "f": "Legacy Windows naming 137-139. Short names. Disable if DNS-only. NetBT over TCP/IP.", "c": "Core"}, {"a": "NFC", "n": "Near-field Communication", "f": "Tap-range 4cm 13.56MHz pay/pairing. Phones/badges. Disable when unused.", "c": "Network"}, {"a": "NIC", "n": "Network Interface Card", "f": "Ethernet/Wi-Fi adapter with MAC, lights. 1Gb/10Gb. Install drivers, check cable.", "c": "Hardware"}, {"a": "NTFS", "n": "New Technology File System", "f": "Windows FS permissions, journal, compression, EFS, quotas. Large files. Vs FAT32/exFAT.", "c": "Core"}, {"a": "NTP", "n": "Network Time Protocol", "f": "Syncs clocks UDP 123 stratum servers. Wrong time breaks Kerberos/TLS. Use pool.ntp.org.", "c": "Network"}, {"a": "NVMe", "n": "Non-volatile Memory Express", "f": "Fast SSD PCIe/M.2 up to 7000MB/s. Low latency vs SATA. Needs UEFI driver, heatsink.", "c": "Hardware"}, {"a": "OEM", "n": "Original Equipment Manufacturer", "f": "Prebuilt/brand license Dell/HP tied to board. Cheaper, no transfer. Vs retail.", "c": "Core"}, {"a": "OLED", "n": "Organic Light-emitting Diode", "f": "Self-lit pixels perfect blacks infinite contrast. No backlight. Burn-in risk. Premium phones/TVs.", "c": "Hardware"}, {"a": "ONT", "n": "Optical Network Terminal", "f": "Fiber box light to Ethernet demarc. Needs power. PON lights. Connects router.", "c": "Hardware"}, {"a": "OS", "n": "Operating System", "f": "Manages HW/apps Windows/macOS/Linux/Android/iOS. 32 vs 64-bit, updates, FS.", "c": "Core"}, {"a": "OTP", "n": "One-time Password (or Passcode)", "f": "Single-use login code via SMS, email, or authenticator app. Prevents replay. See TOTP 30-second rotating vs HOTP counter. 1202 lists as One-time Password/Passcode.", "c": "Security"}, {"a": "PaaS", "n": "Platform as a Service", "f": "Cloud dev platform Heroku/App Service no OS mgmt. Push code, provider scales.", "c": "Core"}, {"a": "PAM", "n": "Privileged Access Management", "f": "Vaults rotates admin passwords, records sessions. Least privilege, MFA admins.", "c": "Security"}, {"a": "PAN", "n": "Personal Area Network", "f": "Tiny ~10m Bluetooth, hotspot, tether. Pairing, low power.", "c": "Core"}, {"a": "PC", "n": "Personal Computer", "f": "Desktop/laptop CPU/RAM/storage. Troubleshoot POST, OS tools.", "c": "Core"}, {"a": "PCI", "n": "Peripheral Component Interconnect", "f": "Legacy 32-bit white slot shared bus slow. Replaced PCIe. Old industrial PCs.", "c": "Hardware"}, {"a": "PCIe", "n": "Peripheral Component Interconnect Express", "f": "Serial x1/x4/x8/x16 for GPU/NVMe. Gen 3/4/5 double speed. Backward compatible.", "c": "Hardware"}, {"a": "PCL", "n": "Printer Command Language", "f": "HP page language for laser. Must match driver. Vs PostScript. Wrong equals garbage.", "c": "Core"}, {"a": "PII", "n": "Personally Identifiable Information", "f": "Sensitive SSN/DOB/address needing encrypt, mask, DLP. Breach notification laws.", "c": "Security"}, {"a": "PIN", "n": "Personal Identification Number", "f": "Numeric SIM/phone/ATM 4-8 digits. Lock after tries. Vs password.", "c": "Core"}, {"a": "PIV", "n": "Personal Identity Verification", "f": "US gov smart-card certs+PIN+biometrics for access. Standard MFA.", "c": "Security"}, {"a": "PoE", "n": "Power over Ethernet", "f": "Power+data over Ethernet for APs/cameras/phones via injector/switch. PoE 802.3af 15.4W (12.95W to device), PoE+ 802.3at 30W (25.5W), PoE++ 802.3bt Type3 60W (51W) / Type4 90W (71W). Check watt budget; bt uses 4-pair.", "c": "Core"}, {"a": "POP", "n": "Post Office Protocol", "f": "Downloads mail, default deletes server copy (leave-on-server optional in client). Ports 110, 995 SSL. Single-device; vs IMAP syncs.", "c": "Network"}, {"a": "POST", "n": "Power-on Self-test", "f": "BIOS/UEFI HW check CPU/RAM/GPU. Beep codes fault. No boot if fail.", "c": "Hardware"}, {"a": "PSU", "n": "Power Supply Unit", "f": "AC to DC 3.3/5/12V. 500-850W 80 Plus, modular. Test multimeter/tester.", "c": "Hardware"}, {"a": "PUP", "n": "Potentially Unwanted Program", "f": "Bundled adware/toolbars grayware. Remove Safe Mode, anti-malware, reset browser.", "c": "Core"}, {"a": "PXE", "n": "Preboot eXecution Environment", "f": "Network boot via DHCP+TFTP to image/deploy OS. Needs PXE NIC, WDS server. F12 typical, boot-menu key varies by vendor.", "c": "Core"}, {"a": "QoS", "n": "Quality of Service", "f": "Prioritizes VoIP/video/gaming via DSCP queues. Cuts jitter/latency.", "c": "Network"}, {"a": "RADIUS", "n": "Remote Authentication Dial-in User Server", "f": "Central AAA for Wi-Fi/VPN/switches, UDP 1812 auth and 1813 acct, shared secret. Vs TACACS+ TCP 49 which encrypts the full payload and separates AAA.", "c": "Network"}, {"a": "RAID", "n": "Redundant Array of Independent Disks", "f": "Combines disks: 0 stripe speed no redundancy, 1 mirror, 5 parity 1-disk loss min 3 disks, 6 2-disk loss min 4 disks, 10 mirror+stripe min 4 disks. HW vs SW.", "c": "Core"}, {"a": "RAM", "n": "Random-access Memory", "f": "Volatile DDR4/5 DIMM/SODIMM. More multitasking. Faults BSOD. Test MemTest.", "c": "Hardware"}, {"a": "RDP", "n": "Remote Desktop Protocol", "f": "Windows remote GUI TCP 3389. Needs NLA, strong password/VPN. Vs VNC/SSH.", "c": "Network"}, {"a": "ReFS", "n": "Resilient File System", "f": "Self-healing Server FS checksums large volumes. No EFS/compress. For Storage Spaces.", "c": "Core"}, {"a": "RFID", "n": "Radio-frequency Identification", "f": "Tap badges/tags: LF 125-134kHz, HF 13.56MHz, UHF 860-960MHz long-range inventory up to ~12m passive. For doors/inventory. Clone risk.", "c": "Core"}, {"a": "RGB", "n": "Red-Green-Blue", "f": "Red-Green-Blue displays/lighting 0-255 each. Vs CMYK print.", "c": "Core"}, {"a": "RISC", "n": "Reduced Instruction Set Computer", "f": "Simple fast low-power CPU ARM. Vs CISC x86 complex.", "c": "Core"}, {"a": "RJ11", "n": "Registered Jack Function 11", "f": "4-wire phone/DSL smaller jack pins 2-3. Needs filter.", "c": "Hardware"}, {"a": "RJ45", "n": "Registered Jack Function 45", "f": "8-wire Ethernet 8P8C T568A/B PoE. Crimp tester continuity.", "c": "Hardware"}, {"a": "RMM", "n": "Remote Monitoring and Management", "f": "MSP remote monitoring patch/AV/backup. Alerts, scripts, remote.", "c": "Core"}, {"a": "RPM", "n": "Revolutions Per Minute", "f": "Disk/fan speed HDD 5400/7200/10k. Higher faster hotter. Check fan cooling.", "c": "Core"}, {"a": "RSR", "n": "Rapid Security Response", "f": "Apple fast patches between updates. Enable auto-update.", "c": "Core"}, {"a": "SaaS", "n": "Software as a Service", "f": "Browser apps M365/Gmail/Salesforce. No install subscription. Needs SSO internet.", "c": "Core"}, {"a": "SAML", "n": "Security Assertions Markup Language", "f": "XML SSO IdP to apps. One login many SaaS. Vs OAuth.", "c": "Network"}, {"a": "SAN", "n": "Storage Area Network", "f": "Block storage iSCSI/FC for servers/VMs LUNs zoning. Vs NAS file.", "c": "Network"}, {"a": "SAS", "n": "Serial Attached SCSI [Small Computer System Interface]", "f": "Enterprise 12Gbps dual-port drives. Reliable servers. Compatible SATA.", "c": "Hardware"}, {"a": "SATA", "n": "Serial Advanced Technology Attachment", "f": "Drive 1.5/3/6Gbps 7-pin data 15-pin power AHCI. Replaced IDE.", "c": "Hardware"}, {"a": "SC", "n": "Subscriber Connector", "f": "Square push-pull fiber connector, 2.5mm ferrule, duplex. Latching, used on patch panels and media converters.", "c": "Hardware"}, {"a": "SCADA", "n": "Supervisory Control and Data Acquisition", "f": "Industrial power/factory PLCs. Old Windows no patch. Isolate OT, VPN.", "c": "Core"}, {"a": "SCSI", "n": "Small Computer System Interface", "f": "Legacy parallel 68-pin IDs 0-15 termination. Replaced SAS/SATA.", "c": "Hardware"}, {"a": "SD", "n": "Secure Digital", "f": "Flash SD/microSD SDHC/SDXC cameras/phones. UHS classes. Lock switch.", "c": "Core"}, {"a": "MSDS", "n": "Material Safety Data Sheet", "f": "Chemical hazard docs with 16 sections: hazards, PPE, first aid. Official exam term is MSDS (Material Safety Data Sheet). Modern GHS calls it SDS. Required by OSHA.", "c": "Core"}, {"a": "SFTP", "n": "Secure File Transfer Protocol", "f": "Encrypted transfer over SSH TCP 22. Secure creds/data. Vs FTP clear, FTPS TLS.", "c": "Network"}, {"a": "SIM", "n": "Subscriber Identity Module", "f": "Carrier ID IMSI/Ki LTE/5G auth Nano-SIM. Lock PIN/PUK.", "c": "Core"}, {"a": "SLA", "n": "Service-level Agreement", "f": "Guarantees uptime/response 99.9% 4hr. Credits if missed.", "c": "Core"}, {"a": "S.M.A.R.T", "n": "Self-monitoring Analysis and Reporting Technology", "f": "Predicts drive failure realloc/temp. Check CrystalDiskInfo. Backup on warning.", "c": "Core"}, {"a": "SMB", "n": "Server Message Block", "f": "Windows sharing TCP 445 versions 2/3 encrypt. Disable v1 WannaCry.", "c": "Network"}, {"a": "SMS", "n": "Short Message Service", "f": "Cell 160-char alerts/2FA. SS7 spoofable. Prefer authenticator over SMS.", "c": "Core"}, {"a": "SMTP", "n": "Simple Mail Transfer Protocol", "f": "Sends mail TCP 25 relay 587 STARTTLS 465 SMTPS. Needs auth no open relay.", "c": "Network"}, {"a": "SNMP", "n": "Simple Network Management Protocol", "f": "Monitors switches/printers via agents: UDP 161 agent query, 162 trap to manager. Versions v2c community string, v3 encrypted. MIB/OID.", "c": "Network"}, {"a": "SODIMM", "n": "Small Outline Dual In-line Memory Module", "f": "Laptop RAM 260-pin DDR4 262-pin DDR5 smaller. Dual-channel pairs.", "c": "Hardware"}, {"a": "SOHO", "n": "Small Office/Home Office", "f": "Small net all-in-one router NAT DHCP firewall Wi-Fi. Change default WPA3.", "c": "Core"}, {"a": "SOP", "n": "Standard Operating Procedure", "f": "Step-by-step installs/backups/escalation. Consistency audit.", "c": "Core"}, {"a": "SPF", "n": "Sender Policy Framework", "f": "DNS TXT allowed mail servers v=spf1. Fails spoof. With DKIM DMARC.", "c": "Security"}, {"a": "SPICE", "n": "Simple Protocol for Independent Computing Environments (1202) / Software Process Improvement and Capability Determination (1201)", "f": "Know both: 1202 = Simple Protocol for Independent Computing Environments, remote display for VMs. 1201 = Software Process Improvement and Capability Determination, process framework.", "c": "Core"}, {"a": "SQL", "n": "Structured Query Language", "f": "Queries DBs SELECT INSERT. Injection via unsanitized input. Use parameters.", "c": "Core"}, {"a": "SSD", "n": "Solid-state Drive", "f": "Flash storage, 2.5in SATA or M.2 NVMe, no moving parts. SATA around 500MB/s, NVMe 7000MB/s or higher Gen5. Check TRIM and health.", "c": "Hardware"}, {"a": "SSH", "n": "Secure Shell", "f": "Encrypted shell TCP 22 keys+MFA tunneling SCP/SFTP. Disable root.", "c": "Network"}, {"a": "SSID", "n": "Service Set Identifier", "f": "Wi-Fi name 32 chars. Hide not security. Use WPA3 strong passphrase.", "c": "Network"}, {"a": "SSO", "n": "Single Sign-on", "f": "One login many apps SAML/OAuth/Kerberos. Convenient single point needs MFA.", "c": "Security"}, {"a": "ST", "n": "Straight Tip", "f": "Round bayonet fiber connector with twist-lock, 2.5mm ferrule. Used for multimode fiber, older installs.", "c": "Hardware"}, {"a": "TACACS+", "n": "Terminal Access Controller Access-control System", "f": "Cisco AAA protocol using TCP port 49, separating authentication, authorization, and accounting and encrypting the full packet. Vs RADIUS. Know as TACACS+ for exam.", "c": "Core"}, {"a": "TCP", "n": "Transmission Control Protocol", "f": "Reliable ordered transport with handshake SYN/SYN-ACK/ACK, ACKs, retransmits. E.g. HTTP 80, HTTPS 443, FTP 20/21, SMTP 25.", "c": "Network"}, {"a": "TKIP", "n": "Temporal Key Integrity Protocol", "f": "Legacy WPA RC4 per-packet crackable. Replaced AES-CCMP WPA2/3. Disable.", "c": "Security"}, {"a": "TN", "n": "Twisted Nematic", "f": "Fast 1ms cheap narrow angles poor color gaming. Vs IPS/VA.", "c": "Hardware"}, {"a": "TOTP", "n": "Time-based One-time Password", "f": "6-8 digit 30s RFC 6238 authenticator. Needs correct time. Backup seeds.", "c": "Security"}, {"a": "TPM", "n": "Trusted Platform Module", "f": "Chip keys BitLocker Secure Boot Hello 2.0 Win11 needs. Enable BIOS.", "c": "Hardware"}, {"a": "TXT", "n": "Text", "f": "Plain text. DNS TXT holds SPF DKIM DMARC verification.", "c": "Core"}, {"a": "UAC", "n": "User Account Control", "f": "Windows admin elevation prompt. Prevents silent malware. Keep default.", "c": "Security"}, {"a": "UDP", "n": "User Datagram Protocol", "f": "Fast connectionless no ACK low overhead DNS 53 DHCP 67/68 streaming VoIP loss-tolerant.", "c": "Network"}, {"a": "UEFI", "n": "Unified Extensible Firmware Interface", "f": "Modern firmware GPT over 2TB Secure Boot mouse GUI fast. F2/Del.", "c": "Hardware"}, {"a": "UPnP", "n": "Universal Plug and Play", "f": "Auto port-forward discovery games/printers. Exposes LAN disable if unused.", "c": "Core"}, {"a": "UPS", "n": "Uninterruptible Power Supply", "f": "A device that provides instant emergency backup power to connected equipment when the main utility power fails or drops to an unsafe voltage. Types standby, line-interactive, online double-conversion. Sized by volt-amp and watt rating. Test runtime, replace batteries.", "c": "Hardware"}, {"a": "USB", "n": "Universal Serial Bus", "f": "Hot-swap 2.0 480Mbps 3.x 5-10Gbps Types A/C 5V. Check drivers/cables.", "c": "Hardware"}, {"a": "USB-C", "n": "Universal Serial Bus Type C", "f": "Reversible 24-pin USB DP Thunderbolt PD up to 240W. Check cable rating.", "c": "Hardware"}, {"a": "UTM", "n": "Unified Threat Management", "f": "All-in-one firewall AV IDS/IPS filter VPN SMB single pane subscription.", "c": "Security"}, {"a": "VA", "n": "Vertical Alignment", "f": "Vertical Alignment LCD: high contrast around 3000:1, decent color, slower than TN/IPS. Good for movies.", "c": "Hardware"}, {"a": "VDI", "n": "Virtual Desktop Infrastructure", "f": "Hosted server desktops thin clients central patch. Needs network licenses.", "c": "Core"}, {"a": "VGA", "n": "Video Graphics Array", "f": "Analog blue 15-pin DB-15 ghosting long cables. Replaced HDMI/DP.", "c": "Hardware"}, {"a": "VLAN", "n": "Virtual LAN [Local Area Network]", "f": "Segments switch ID 1-4094 isolates broadcasts. Trunk 802.1Q needs router inter-VLAN.", "c": "Network"}, {"a": "VM", "n": "Virtual Machine", "f": "Emulated PC Hyper-V/VMware/VirtualBox shares CPU/RAM/disk snapshots vNICs.", "c": "Core"}, {"a": "VNC", "n": "Virtual Network Computer", "f": "Remote RFB TCP 5900 cross-platform no encrypt default tunnel SSH/VPN.", "c": "Network"}, {"a": "VoIP", "n": "Voice over Internet Protocol", "f": "Voice SIP 5060/5061 + RTP needs QoS PoE codec jitter hurts.", "c": "Network"}, {"a": "VPN", "n": "Virtual Private Network", "f": "Encrypted IPsec/OpenVPN/WireGuard remote LAN MFA split/full tunnel.", "c": "Network"}, {"a": "VRAM", "n": "Video Random-access Memory", "f": "GPU GDDR6 frame/textures more higher res. Shared vs dedicated.", "c": "Hardware"}, {"a": "WAN", "n": "Wide Area Network", "f": "Across cities Internet MPLS leased routers CSU/DSU high latency.", "c": "Network"}, {"a": "WAP", "n": "Wireless Access Point", "f": "Adds Wi-Fi to a wired LAN. Place high and central, use channels 1, 6, 11, WPA3 security, and PoE power.", "c": "Network"}, {"a": "WEP", "n": "Wired Equivalent Privacy", "f": "Obsolete RC4 64/128 crack minutes never use upgrade WPA2/3-AES.", "c": "Network"}, {"a": "WinRM", "n": "Windows Remote Management", "f": "WS-Management 5985/5986 PowerShell remoting winrm quickconfig.", "c": "Network"}, {"a": "WISP", "n": "Written Internet Service Provider", "f": "Wireless/cellular/satellite rural dish antenna caps. CompTIA says Written.", "c": "Core"}, {"a": "WLAN", "n": "Wireless LAN [Local Area Network]", "f": "Local Wi-Fi 802.11 a/b/g/n/ac/ax Wi-Fi 6 SSID WPA3 survey interference.", "c": "Network"}, {"a": "WPA", "n": "Wi-Fi Protected Access", "f": "Wi-Fi Protected Access: original WPA with TKIP, WPA2 with AES-CCMP, WPA3 with SAE. Use WPA3-Personal or Enterprise with a long passphrase.", "c": "Network"}, {"a": "WWAN", "n": "Wireless Wide Area Network", "f": "Cellular LTE/5G SIM/eSIM laptops metered modem/hotspot.", "c": "Network"}, {"a": "XaaS", "n": "Anything as a Service", "f": "Any cloud subscription SaaS/PaaS/IaaS OpEx vs CapEx.", "c": "Core"}, {"a": "XDR", "n": "Extended Detection and Response", "f": "Correlates endpoint/net/cloud AI beyond EDR auto-isolates.", "c": "Security"}, {"a": "XFS", "n": "Extended File System", "f": "Journaling high-perf Linux large files online grow vs ext4.", "c": "Core"}, {"a": "XSS", "n": "Cross-site Scripting", "f": "Injects scripts trusted pages stored/reflected/DOM prevent encoding CSP. 1201 lists XXS.", "c": "Security"}];

let examFilter='all';
function inFilter(di){ const tag=EXAM[DATA[di].a]||'Both'; if(examFilter==='all') return true; if(examFilter==='1201') return tag==='1201'||tag==='Both'; if(examFilter==='1202') return tag==='1202'||tag==='Both'; return true; }

const ESCAPED={}; SORTED.forEach(ac=>{ ESCAPED[ac]=ac.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); });

const FULLRE=new RegExp('\\b('+FULLPATTERN+')(?![A-Za-z0-9])(?!\\s*\\()','g');
function expandAcros(text, skipSelf){
  try{
    return text.replace(FULLRE,(m,off)=>{
      if(m===skipSelf) return m;
      if(m.length<2) return m;
      const after=text.slice(off+m.length, off+m.length+2);
      if(/^\s*\(/.test(after)) return m;
      return m+' ('+GLOSS[m]+')';
    });
  }catch(e){ return text; }
}
let wrongDetail={}, order=DATA.map((_,i)=>i), idx=0, flipped=false, known=new Set(), wrong=new Set(), mcAnswer=-1, thisDir='a2d', mcLocked=false, mcTimeout=null, reviewOpen=false;

function curDir(){let d=dir.value; if(d==='mix') return Math.random()<0.5?'a2d':'d2a'; return d;}
function render(){
  reviewOpen=false;

function update(){let done=0; for(const oi of order){ if(known.has(oi)||wrong.has(oi)) done++; } count.textContent='Card '+(idx+1)+'/'+order.length;score.textContent='Knew: '+known.size+' • Review: '+wrong.size;bar.style.width=(done/Math.max(1,order.length)*100)+'%';}

function resetAll(){ clearPending(); known.clear(); wrong.clear(); wrongDetail={}; prevCardId=null; prevModeVal=''; prevDirVal=''; const pool=DATA.map((_,i)=>i).filter(typeof inFilter==='function'?inFilter:()=>true); order=fyShuffle([...pool]); idx=0; flipped=false; document.getElementById('review').style.display='none'; render(); }
